<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a1519"><title>Monster Mash · Rạp chuyển cảnh</title>
<link rel="stylesheet" href="../assets/fonts/fonts.css?v=4.3.4"><link rel="icon" href="../assets/favicon.svg">
<style>
:root{color-scheme:dark;--ink:#e6e6d7;--muted:#91aaa8;--gold:#dfb875;--line:#314646}*{box-sizing:border-box}body{margin:0;background:#091316;color:var(--ink);font:14px 'Noto Sans',sans-serif}main{width:min(1440px,100%);margin:auto;padding:24px 30px}header{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:20px}h1{font:600 clamp(23px,3vw,34px) 'Noto Serif',serif;margin:5px 0 7px}p{margin:0;color:var(--muted);line-height:1.65}small,.eyebrow{font-size:10px;letter-spacing:2px;color:var(--gold)}a{color:var(--gold);text-decoration:none}header a{white-space:nowrap;font-size:12px;padding-bottom:4px}.theatre{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#071016;box-shadow:0 24px 70px #0004}.frame{position:relative;background:#030b10;display:flex;align-items:center;justify-content:center}canvas{display:block;aspect-ratio:16/9;width:100%;height:auto;max-height:calc(100dvh - 260px);object-fit:contain;touch-action:manipulation;outline:none}.caption{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 18px;border-top:1px solid var(--line)}.caption strong{font-size:13px;font-weight:600}.caption span{font-size:11px;color:var(--muted)}.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:16px 0 10px}button{font:inherit;cursor:pointer;color:var(--ink);border:1px solid var(--line);border-radius:7px;background:#112428;padding:11px 13px}button:hover{border-color:#95b3ac}button[aria-pressed=true]{border-color:var(--gold);color:#ffddaa;background:#3c3424}.play{background:var(--gold);border-color:var(--gold);color:#1b261f;font-weight:700}.controls .play{margin-left:auto}button:disabled{opacity:.45;cursor:wait}.timeline{display:flex;align-items:center;gap:14px;padding:0 2px}.timeline input{flex:1;accent-color:var(--gold);cursor:pointer;min-width:70px}.timeline output{font-size:11px;color:var(--muted);min-width:80px;text-align:right}.options{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:15px;color:var(--muted);font-size:11px}.options label{display:flex;align-items:center;gap:6px}.options input{accent-color:var(--gold)}button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:3px}@media(max-width:700px){main{padding:16px 12px}header{align-items:start;flex-direction:column;gap:9px;margin-bottom:13px}.controls{gap:6px}.controls button{font-size:11px;padding:9px 10px}.controls .play{margin-left:0}canvas{max-height:none}.caption{padding:10px 12px}.caption span{max-width:58%;text-align:right;font-size:10px}.options{line-height:1.8}.theatre{border-radius:9px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>
</head>
<body><main>
<header><div><span class="eyebrow">MONSTER MASH · CHUYỂN CẢNH</span><h1>Đi qua những miền ký ức.</h1><p>Bốn chặng đường, một hành trình của người giữ đèn.</p></div><a href="../?test=all&v=4.3.4">Trở lại bản chơi thử ↗</a></header>
<section class="theatre" aria-label="Rạp chuyển cảnh"><div class="frame"><canvas id="cinema" width="960" height="540" tabindex="0" aria-label="Hoạt ảnh chuyển cảnh Monster Mash"></canvas></div><div class="caption"><strong id="scene-name">Lời Nguyền Cổ Thú</strong><span id="status" role="status">Đang chuẩn bị bối cảnh…</span></div></section>
<nav class="controls" aria-label="Chọn chuyển cảnh"><button data-scene="forest" aria-pressed="true" disabled>01 · Vào rừng</button><button data-scene="cave" aria-pressed="false" disabled>02 · Vào hang</button><button data-scene="whirlpool" aria-pressed="false" disabled>03 · Xoáy nước</button><button data-scene="ending" aria-pressed="false" disabled>04 · Trở về</button><button id="play-all" class="play" disabled>Phát cả hành trình ▶</button><button id="pause" disabled>Tạm dừng</button></nav>
<div class="timeline"><label for="seek" class="eyebrow">THƯỚC PHIM</label><input id="seek" type="range" min="0" max="1000" step="10" value="0" aria-label="Vị trí chuyển cảnh" disabled><output id="time">0,0 / 5,0s</output></div>
<div class="options"><label><input id="reduced" type="checkbox">Giảm chuyển động</label><span>Space: dừng / tiếp tục · ← →: đổi cảnh · Có thể kéo thước phim để xem từng động tác.</span></div>
</main>
<script src="../js/typography.js?v=4.3.4"></script><script src="../js/renderer.js?v=4.3.4"></script><script src="../js/chapter-transition.js?v=4.3.4"></script>
<script>
(()=>{'use strict';
 const $=id=>document.getElementById(id),canvas=$('cinema'),c=canvas.getContext('2d'),T=MM.ChapterTransition;
 const scenes=['forest','cave','whirlpool','ending'],names={forest:'Lời Nguyền Cổ Thú · 50 → 51',cave:'Vực Sâu Cổ Đại · 100 → 101',whirlpool:'Hải Vực Quên Lãng · 150 → 151',ending:'Bình minh trở lại · Kết thúc màn 200'};
 const g={screen:'playing',settings:{effects:true,reducedMotion:false},level:{id:200,underwater:true},player:{x:480,y:438,w:38,h:54,dir:1,health:5,ammo:12,shotTimer:0},enemies:[],underwater:{bubbles:[]},clearInputs(){},ui:{}};
 g.endingBoss={archetype:'kraken',type:'boss',x:680,y:435,w:390,h:360,health:0,dead:true,phase:'active',dir:-1};
 let current='forest',paused=false,ready=false,last=0,held=null,queue=[];
 const fmt=n=>n.toFixed(1).replace('.',',');
 function select(kind){current=kind;$('scene-name').textContent=names[kind];for(const b of document.querySelectorAll('[data-scene]'))b.setAttribute('aria-pressed',String(b.dataset.scene===kind));}
 function play(kind){
  g.cinematic=null;g.screen='playing';held=null;paused=false;select(kind);g.settings.reducedMotion=$('reduced').checked;
  T.begin(g,kind,()=>{held={...shot,time:shot.duration*(kind==='ending'?.98:.8)};if(queue.length){play(queue.shift());}else $('status').textContent='Đã phát xong · chọn cảnh hoặc phát lại hành trình.';});
  const shot=g.cinematic;last=0;$('pause').textContent='Tạm dừng';$('status').textContent=queue.length?'Đang phát cả hành trình':'Đang trình chiếu';
 }
 function toggle(){if(!ready)return;if(!g.cinematic)play(current);paused=!paused;queue=[];$('pause').textContent=paused?'Tiếp tục':'Tạm dừng';$('status').textContent=paused?'Đã dừng · kéo thước phim để xem từng khung hình.':'Đang trình chiếu';}
 for(const b of document.querySelectorAll('[data-scene]'))b.onclick=()=>{queue=[];play(b.dataset.scene);};
 $('play-all').onclick=()=>{queue=scenes.slice(1);play(scenes[0]);};$('pause').onclick=toggle;
 $('seek').oninput=()=>{queue=[];if(!g.cinematic)play(current);paused=true;g.cinematic.time=Number($('seek').value)/1000*g.cinematic.duration;$('pause').textContent='Tiếp tục';$('status').textContent='Đã dừng · đang xem từng khung hình.';};
 $('reduced').onchange=()=>{queue=[];play(current);};
 window.addEventListener('keydown',e=>{if(!ready||/INPUT|BUTTON|A/.test(e.target.tagName))return;if(e.code==='Space'){e.preventDefault();toggle();}else if(e.code==='ArrowLeft'||e.code==='ArrowRight'){e.preventDefault();queue=[];play(scenes[(scenes.indexOf(current)+(e.code==='ArrowLeft'?3:1))%4]);}});
 document.addEventListener('visibilitychange',()=>{if(document.hidden&&g.cinematic){paused=true;$('pause').textContent='Tiếp tục';$('status').textContent='Đã tạm dừng khi rời tab.';}last=0;});
 function render(now){const dt=last?Math.max(0,(now-last)/1000):0;last=now;if(ready&&g.cinematic&&!paused)T.update(g,dt);
  const shot=g.cinematic||held;if(shot){T.draw(c,g.cinematic?g:{...g,screen:'cinematic',cinematic:shot});$('seek').value=Math.round(1000*shot.time/shot.duration);$('time').textContent=fmt(shot.time)+' / '+fmt(shot.duration)+'s';}requestAnimationFrame(render);}
 Promise.all([MM.Typography.ready,T.allArtReady]).then(()=>{ready=true;for(const e of document.querySelectorAll('button,#seek'))e.disabled=false;const kind=location.hash.slice(1);queue=[];play(scenes.includes(kind)?kind:'forest');});
 requestAnimationFrame(render);
})();
</script></body></html>
