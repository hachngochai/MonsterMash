<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kiểm tra hiệu ứng boss · 2.3.1</title><link rel="stylesheet" href="../assets/fonts/fonts.css?v=2.3.1">
<style>body{margin:20px;background:#101714;color:#e9eade;font:14px/1.5 'Noto Sans',sans-serif}main{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}h1{font-size:20px}h2{font-size:14px;margin:0 0 6px}canvas{display:block;width:100%;border:1px solid #ffffff25;border-radius:8px}@media(max-width:700px){main{grid-template-columns:1fr}}</style>
<h1>Kiểm tra hiệu ứng và dấu tiếng Việt · 2.3.1</h1><main id="previews"></main>
<script src="../js/typography.js?v=2.3.1"></script><script src="../js/campaign.js?v=2.3.1"></script><script src="../js/bosses.js?v=2.3.1"></script><script src="../js/golem.js?v=2.3.1"></script><script src="../js/wolves.js?v=2.3.1"></script><script src="../js/renderer.js?v=2.3.1"></script><script src="../js/game.js?v=2.3.1"></script>
<script>
(async()=>{
await MM.Typography.ready;
const samples=[
 [10,'10 · Cột xương báo trước',(g,b)=>{g.bossHazards=[-132,0,132].map(offset=>({owner:b,kind:'bones',x:440+offset,y:438,w:38,h:58,phase:'warning',timer:.8,warning:1.2,totalActive:.65,life:1.45,pulse:.4}));b.skillWarning={name:'CỘT XƯƠNG',remaining:.8,total:1.2};}],
 [20,'20 · Thây ma xanh cường hóa',(g,b)=>{b.hardenedTime=1.7;b.armorHits=0;}],
 [30,'30 · Tơ gây choáng và trứng nhện',(g,b)=>{g.configureAbility(b,'hanging');b.x=670;g.player.stunTime=1.6;g.bossEggs=[{owner:b,x:370,y:438,w:28,h:32,health:1,maxHealth:2,hatchTime:3.4,landed:true}];g.enemyShots=[{kind:'web',x:510,y:350,w:30,h:24,life:3}];}],
 [32,'32 · So sánh zombie thường, zombie xanh, bộ xương và nhện',(g,b)=>{b.x=260;b.y=438;b.abilityState='ground';b.platform=null;g.player.x=520;for(const[type,x]of[['skeleton',125],['greenZombie',380],['spider',740]]){const e=g.spawn(type);e.phase='active';e.x=x;e.y=438;e.abilityState='ground';e.platform=null;}},'zombie'],
 [40,'40 · Ma trắng tàng hình',(g,b)=>{b.intangible=true;b.phantomState='invisible';b.skillWarning={name:'ẨN MÌNH',remaining:1.1,total:1.5};}],
 [40,'40 · Tập kích từ trên',(g,b)=>{b.phantomState='windup';b.attackSide='top';b.landX=440;b.x=440;b.y=235;b.skillWarning={name:'TẬP KÍCH TỪ TRÊN',remaining:.9,total:1.2};}],
 [40,'40 · Người chơi bị đánh ngã',(g,b)=>{g.player.knockdownTime=.6;g.player.stunTime=.6;b.phantomState='strike';b.attackSide='left';b.x=550;}],
 [50,'50 · Dracula báo hút máu',(g,b)=>{g.morphToBat(b);b.x=680;b.y=275;b.drainWarning={remaining:.9,total:1.2};}],
 [50,'50 · Hai bản thể Dracula',(g,b)=>{b.x=250;b.health=17;MM.BossCombat.update(g,.01);const clone=g.enemies.find(e=>e.draculaClone);clone.phase='active';clone.x=700;g.morphToBat(clone);clone.y=280;clone.drainWarning={remaining:1,total:1.2};}],
 [51,'51 · Thung lũng nguyền rủa — Golem thường giơ chùy',(g,b)=>{b.x=680;b.dir=-1;b.golemState='windup';b.swingProgress=0;g.golemZones=[{owner:b,kind:'club',x:485,y:438,w:145,h:54,phase:'warning',timer:.8,total:1.2}];for(const[type,x]of[['skeleton',130],['spider',815]]){const e=g.spawn(type);e.phase='active';e.x=x;e.y=438;e.abilityState='ground';}},'golem'],
 [60,'60 · Golem chúa cuồng nộ — sóng chấn báo trước',(g,b)=>{b.x=680;b.dir=-1;b.rageTime=4.8;b.golemState='rage-windup';b.skillWarning={name:'CUỒNG NỘ · SÓNG CHẤN',remaining:.8,total:1.2};g.golemZones=[{owner:b,kind:'shock',x:480,y:438,w:360,h:38,phase:'warning',timer:.8,total:1.2}];}],
 [60,'60 · Sóng chấn — đất nứt và đá bật lên',(g,b)=>{b.x=680;b.dir=-1;b.rageTime=4.5;b.golemState='shock';b.swingProgress=1;g.golemZones=[{owner:b,kind:'shock',x:480,y:438,w:360,h:38,phase:'impact',timer:.15,total:.3}];g.groundCracks=[{owner:b,x:480,y:438,w:375,life:1.8,maxLife:2}];}]
];
for(let index=1;index<=3;index++)samples.push([60,`60 · Liên hoàn chùy ${index}/3${index===3?' — hiệu ứng tắt':''}`,(g,b)=>{b.x=680;b.dir=-1;b.rageTime=4.3-index*.6;b.golemState='combo-swing';b.comboIndex=index;b.swingProgress=index/3;g.golemZones=[{owner:b,kind:'slam',x:445,y:438,w:210,h:60,phase:'impact',timer:.14,total:.28,comboIndex:index}];g.groundCracks=[{owner:b,x:445,y:438,w:220+index*12,life:1.5,maxLife:2}];if(index===3)g.settings.effects=false;}]);
const bloodMoon=(g,b)=>{b.bloodMoon=true;b.w=160;b.h=216;b.health=b.maxHealth;b.x=680;b.dir=-1;g.player.weaponMode='sniper';g.player.ammo=25;g.player.shotCooldown=1;};
samples.push(
 [61,'61 · Rừng gai cũ — Golem mini cao bằng bộ xương',(g,b)=>{b.x=280;b.dir=1;b.golemState='windup';const skeleton=g.spawn('skeleton');skeleton.phase='active';skeleton.x=150;skeleton.y=438;skeleton.abilityState='ground';skeleton.platform=null;g.golemZones=[{owner:b,kind:'club',x:330,y:438,w:95,h:44,phase:'warning',timer:.6,total:1}];},'miniGolem'],
 [62,'62 · Người sói báo vị trí vồ xuống',(g,b)=>{b.x=660;b.dir=-1;b.wolfState='windup';b.wolfProgress=.4;g.wolfZones=[{owner:b,kind:'pounce',x:440,y:438,w:118,h:52,phase:'warning',timer:.7,total:1.1}];},'werewolf'],
 [62,'62 · Người sói nhảy lên trước khi vồ',(g,b)=>{b.x=565;b.y=308;b.dir=-1;b.wolfState='leap';b.wolfProgress=.5;g.wolfZones=[{owner:b,kind:'pounce',x:440,y:438,w:118,h:52,phase:'warning',timer:.25,total:.55}];},'werewolf'],
 [62,'62 · Người sói tiếp đất và vồ xuống',(g,b)=>{b.x=480;b.dir=-1;b.wolfState='pounce';b.wolfProgress=.6;g.wolfZones=[{owner:b,kind:'pounce',x:440,y:438,w:118,h:52,phase:'impact',timer:.15,total:.3}];},'werewolf'],
 [70,'70 · Lang Vương — giai đoạn thường',(g,b)=>{b.dir=-1;b.wolfState='windup';b.wolfProgress=.3;b.skillWarning={name:'LANG VƯƠNG VỒ XUỐNG',remaining:.9,total:1.1};g.wolfZones=[{owner:b,kind:'pounce',x:440,y:438,w:164,h:60,phase:'warning',timer:.9,total:1.1}];}],
 [70,'70 · Trăng máu — Lang Vương lớn gấp đôi và hồi đầy máu',(g,b)=>{bloodMoon(g,b);b.wolfState='transform';b.intangible=true;b.transformTime=.7;b.skillWarning={name:'TRĂNG MÁU · THỨC TỈNH',remaining:.7,total:1.2};}],
 [70,'70 · Súng ngắm — vệt đạn xuyên màn đêm đỏ',(g,b)=>{bloodMoon(g,b);b.wolfState='approach';b.health=b.maxHealth-5;g.player.dir=1;g.player.shotTimer=.97;g.bullets=[{x:564,y:409,vx:1280,dir:1,kind:'sniper',damage:5}];}]
);
for(let index=1;index<=2;index++)samples.push([70,`70 · Trăng máu — cào ${index}/2${index===2?' · hiệu ứng tắt':''}`,(g,b)=>{bloodMoon(g,b);b.x=555;b.wolfState=index===1?'claw-windup':'claw';b.wolfProgress=index===1?0:.6;b.clawIndex=index;b.skillWarning={name:`LIÊN HOÀN CÀO ${index}/2`,remaining:.6,total:1.1};g.wolfZones=[{owner:b,kind:'claw',x:440,y:438,w:210,h:64,phase:index===1?'warning':'impact',timer:index===1?.6:.17,total:index===1?1.1:.3,damage:2,clawIndex:index}];if(index===2)g.settings.effects=false;}]);
const prepareRock=(g,b)=>{b.x=720;b.dir=-1;b.golemState='rock-windup';b.golemStateTotal=1.15;b.golemStateTimer=.45;b.throwProgress=0;b.rockAimX=g.player.x;b.rockAimY=g.player.y-26;b.rockOriginX=b.x+b.dir*b.w*.33;b.rockOriginY=b.y-b.h*.60;b.skillWarning={name:'NÉM ĐÁ',remaining:.45,total:1.15};};
samples.push(
 [51,'51 · Golem giơ đá — đường ngắm cố định',(g,b)=>{prepareRock(g,b);},'golem'],
 [61,'61 · Golem mini — đá có cạnh và bụi bay',(g,b)=>{prepareRock(g,b);g.enemyShots=[{kind:'rock',type:'rock',owner:b,x:565,y:398,vx:-320,vy:25,w:16,h:16,life:2,damage:1,rotationSeed:.8}];},'miniGolem'],
 [60,'60 · Golem chúa — ném ba viên đá, hiệu ứng tắt',(g,b)=>{prepareRock(g,b);g.settings.effects=false;const angle=Math.atan2(b.rockAimY-b.rockOriginY,b.rockAimX-b.rockOriginX);g.enemyShots=[-.13,0,.13].map((spread,index)=>({kind:'rock',type:'rock',owner:b,x:b.rockOriginX+Math.cos(angle+spread)*150,y:b.rockOriginY+Math.sin(angle+spread)*150,vx:Math.cos(angle+spread)*340,vy:Math.sin(angle+spread)*340,w:27,h:27,life:2,damage:1,rotationSeed:index*.7}));}]
);
for(const[id,title,configure,type='boss']of samples){
 const g=new MM.Game({headless:true,random:()=>.5,storage:{getItem:()=>null,setItem:()=>{}}});g.start(id);g.levelKills=type==='boss'?g.level.target:0;g.bossSpawned=type==='boss';g.time=7;
 const b=g.spawn(type);b.phase='active';b.x=680;b.y=438;g.player.x=440;g.player.invulnerable=0;configure(g,b);
 const section=document.createElement('section'),heading=document.createElement('h2'),canvas=document.createElement('canvas');heading.textContent=title;canvas.width=960;canvas.height=540;section.append(heading,canvas);document.getElementById('previews').append(section);MM.Renderer.draw(canvas.getContext('2d'),g);
}
})();
</script></html>
