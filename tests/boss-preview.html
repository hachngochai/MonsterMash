const previewed=new Set(),previewViews=[];
for(const[id,title,configure,type='boss',anchor]of samples){
 const g=new MM.Game({headless:true,random:()=>.5,storage:{getItem:()=>null,setItem:()=>{}}});g.start(id);g.levelKills=type==='boss'?g.level.target:0;g.bossSpawned=type==='boss';g.time=7;
 const b=g.spawn(type);b.phase='active';b.x=680;b.y=438;g.player.x=440;g.player.invulnerable=0;configure(g,b);
 const section=document.createElement('section'),heading=document.createElement('h2'),canvas=document.createElement('canvas');if(anchor)section.id=anchor;else if(!previewed.has(id)){section.id='preview-'+id;previewed.add(id);}heading.textContent=title;canvas.width=960;canvas.height=540;section.append(heading,canvas);document.getElementById('previews').append(section);MM.Renderer.draw(canvas.getContext('2d'),g);previewViews.push({game:g,canvas,iceFalls:g.dragonZones.filter(z=>z.kind==='ice'&&z.phase==='falling')});
}
if(typeof window.requestAnimationFrame==='function'){
 const motion=document.getElementById('preview-motion');let running=false,last=0,animationFrame=0;
 function animate(stamp){
   if(!running)return;
   if(stamp-last>=1000/30){const dt=last?Math.min(.05,(stamp-last)/1000):0;last=stamp;
     for(const view of previewViews){const rect=view.canvas.getBoundingClientRect();if(rect.bottom<=0||rect.top>=window.innerHeight)continue;view.game.time+=dt;
       view.iceFalls.forEach((z,i)=>{const phase=((view.game.time-7+i*.12)%1.85+1.85)%1.85;
         if(phase<.95){z.phase='warning';z.y=438;z.timer=.95-phase;z.total=.95;}
         else if(phase<1.7){z.phase='falling';z.y=20+(438-20)*(phase-.95)/.75;z.timer=1.7-phase;z.total=.75;}
         else{z.phase='impact';z.y=438;z.timer=1.85-phase;z.total=.15;}
       });MM.Renderer.draw(view.canvas.getContext('2d'),view.game);}
   }
   animationFrame=window.requestAnimationFrame(animate);
 }
 motion?.addEventListener('click',()=>{running=!running;motion.setAttribute('aria-pressed',String(running));motion.textContent=running?'Ⅱ Dừng hiệu ứng':'▶ Chạy hiệu ứng';last=0;if(animationFrame)window.cancelAnimationFrame(animationFrame);animationFrame=running?window.requestAnimationFrame(animate):0;});
}
