<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vực Sâu Cổ Đại · Phòng thử 101–150</title>
<link rel="stylesheet" href="../assets/fonts/fonts.css"><style>
*{box-sizing:border-box}body{margin:0;background:#0e111b;color:#e8dfcb;font:14px 'Noto Sans',sans-serif}header,main{max-width:1120px;margin:auto;padding:24px}header{position:sticky;top:0;background:#0e111bf5;z-index:2;border-bottom:1px solid #43384f}h1{font:600 28px 'Noto Serif',serif;margin:0 0 8px}p{color:#b7afc4}nav{display:flex;gap:8px;flex-wrap:wrap}a,button,select{color:#e8dfcb;background:#272235;border:1px solid #695777;border-radius:8px;padding:9px 13px;font:inherit;text-decoration:none;cursor:pointer}button[aria-pressed=true]{background:#6c426a}section{margin-bottom:30px;scroll-margin-top:220px}canvas{display:block;width:100%;aspect-ratio:16/9;background:#14101b;border:1px solid #655072;border-radius:12px}h2{font-size:16px}small{color:#b7afc4}label{display:flex;align-items:center;gap:8px;margin:10px 0}.notes{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:10px 0}
header{padding:16px 24px}header h1{font-size:25px;line-height:1.2}header p{font-size:13px;margin:6px 0 10px}nav a,nav button{padding:7px 10px;font-size:13px}header small{display:block;font-size:11px;margin-top:8px}main{max-width:min(1120px,calc((100svh - 320px)*1.7778 + 48px));width:100%} @media(max-width:860px){main{max-width:min(100%,calc((100svh - 390px)*1.7778 + 48px))}} @media(max-height:500px){header{position:relative}main{max-width:900px}}
</style>
<header><h1>Vực Sâu Cổ Đại</h1><p>Phòng thử mô hình, ánh sáng và giao tranh 101–150. Dữ liệu thử tách riêng khỏi tiến độ thật.</p><nav><a href="../">Mở game</a><a href="#preview-110">110 · Minotaur</a><a href="#preview-120">120 · Hoa Quỷ</a><a href="#preview-130">130 · Rùa Kính</a><a href="#preview-140">140 · Cổ Điểu</a><a href="#preview-150">150 · Cổ Thần</a><button id="motion" aria-pressed="false">Chạy giao tranh</button></nav><small>A/D bắn · ←/→ đi · ↑ nhảy · Space khiên · F đổi vũ khí. Chọn khung hình để điều khiển.</small></header><main id="scenes"></main>
<script src="../js/abyss-config.js"></script><script src="../js/underwater-config.js?v=4.1.0"></script><script src="../js/middle-sea-config.js?v=4.2.0"></script><script src="../js/predator-sea-config.js?v=4.4.1"></script><script src="../js/deep-sea-config.js?v=4.4.1"></script><script src="../js/final-sea-config.js?v=4.4.1"></script><script src="../js/island-config.js?v=4.4.1"></script><script src="../js/campaign.js"></script><script src="../js/save-manager.js"></script><script src="../js/boss-manager.js"></script><script src="../js/map-manager.js"></script><script src="../js/skill-manager.js"></script><script src="../js/weapon-manager.js"></script><script src="../js/input-manager.js"></script><script src="../js/bosses.js"></script><script src="../js/golem.js"></script><script src="../js/wolves.js"></script><script src="../js/kong.js"></script><script src="../js/dragons.js"></script><script src="../js/mythic.js"></script><script src="../js/abyss-combat.js"></script><script src="../js/abyss-renderer.js?v=4.4.1"></script><script src="../js/ocean-visuals.js?v=4.4.1"></script><script src="../js/renderer.js"></script><script src="../js/chapter-transition.js?v=4.4.1"></script><script src="../js/island-combat.js?v=4.4.1"></script><script src="../js/resurrection-rewards.js?v=4.4.1"></script><script src="../js/island-art.js?v=4.4.1"></script><script src="../js/island-fx.js?v=4.4.1"></script><script src="../js/island-renderer.js?v=4.4.1"></script><script src="../js/game.js"></script>
<script>
(()=>{'use strict';const views=[],root=document.getElementById('scenes');let selected=null,running=false,last=0;
const entries=[[110,'Mê Cung Minotaur',['minotaurCalf']],[120,'Mộc Tâm Hoa Quỷ',['parasite','minotaurCalf']],[130,'Xích Kính Quái Sùng',['littleTurtle']],[140,'Hóa Thạch Sí Vũ',['abyssCrow','lanternSkeleton']],[150,'Thiên Thủ Cổ Thần',['clayGuard','ancientHand','tombSpirit']]];
function reset(view){const g=view.game;g.start(view.id);g.spawnTimer=999;g.levelKills=g.level.target;g.bossSpawned=true;g.enemies=[];g.player.x=270;g.player.invulnerable=0;g.shieldCount=12;g.player.ammo=g.player.maxAmmo;const b=g.spawn('boss',-1);b.phase='active';b.x=710;g.time=2;view.boss=b;view.form.value='base';view.weapon.value='gun';g.progression.equipped='gun';view.regular.forEach((type,i)=>{const e=g.spawn(type);e.phase='active';e.x=450+i*90;e.abyssHomeX=e.x;});}
for(const[id,title,regular]of entries){const section=document.createElement('section');section.id='preview-'+id;const heading=document.createElement('h2');heading.textContent=id+' · '+title;const tools=document.createElement('div');tools.className='notes';const form=document.createElement('select');form.setAttribute('aria-label','Trạng thái boss '+id);const variants=id===150?[['base','Hỉ · Đảo trọng lực'],['rage','Nộ · Chấn động'],['love','Ái · Bản sao'],['hate','Ố · Bóng tối'],['turn','Head turn and color transition'],['maze','Mê cung · Một thanh máu']]:id===140?[['base','Phượng điểu hóa thạch'],['knight','Kỵ sĩ đầu chim']]:id===130?[['base','Thân thực'],['invisible','Tàng hình'],['mirror','Phản chiếu']]:id===110?[['base','Giao tranh thường'],['rush','Cuồng Nộ · Húc mỗi 10s']]:[['base','Giao tranh thường']];for(const[value,text]of variants)form.add(new Option(text,value));const weapon=document.createElement('select');weapon.setAttribute('aria-label','Vũ khí thử '+id);for(const v of ['gun','bones','club','bow','spear','axes','hammer','scythe'])weapon.add(new Option(MM.WeaponManager.names[v],v));const retry=document.createElement('button');retry.textContent='Khởi động lại';const readout=document.createElement('small');tools.append(form,weapon,retry,readout);const canvas=document.createElement('canvas');canvas.width=960;canvas.height=540;canvas.tabIndex=0;canvas.setAttribute('aria-label','Đấu trường thử màn '+id);section.append(heading,tools,canvas);root.append(section);const g=new MM.Game({headless:true,random:Math.random,storage:{getItem:()=>null,setItem:()=>{}}});g.progression.rewards=[10,20,30,40,50,60,80,90,100,110,120,130,140];const view={id,regular,game:g,canvas,form,weapon,readout};views.push(view);reset(view);
retry.onclick=()=>reset(view);weapon.onchange=()=>MM.WeaponManager.select(g,weapon.value);canvas.onpointerdown=()=>{selected=view;canvas.focus();};form.onchange=()=>{const value=form.value;reset(view);form.value=value;const b=view.boss;if(id===110&&value==='rush'){b.minotaurRage=true;b.abyssState='charge';b.abyssAttackDir=-1;b.abyssTimer=1.4;b.dir=-1;}if(value==='knight')g.dealEnemyDamage(b,b.health,{kind:'preview',melee:true});if(value==='invisible'){b.invisible=true;b.invisibleTime=5;}if(value==='mirror'){b.mirrorShield=true;b.abyssState='mirror';b.abyssTimer=2.6;}if(id===150&&['rage','love','hate'].includes(value)){MM.AbyssCombat.enterEmotion(g,b,value);b.abyssEmotionIndex=MM.AbyssConfig.combat.deity.emotionOrder.indexOf(value);}if(id===150&&value==='turn'){MM.AbyssCombat.enterEmotion(g,b,'rage');b.abyssEmotionIndex=1;view.turnPreview=1.4;}if(value==='maze')g.dealEnemyDamage(b,b.maxHealth*.5,{kind:'preview',melee:true});draw(view);};}
function draw(v){MM.Renderer.draw(v.canvas.getContext('2d'),v.game);v.readout.textContent='HP '+Number(v.game.player.health.toFixed(1))+' · Khiên '+v.game.shieldCount+' · '+v.game.screen;}
document.getElementById('motion').onclick=event=>{running=!running;event.currentTarget.setAttribute('aria-pressed',String(running));event.currentTarget.textContent=running?'Dừng giao tranh':'Chạy giao tranh';last=0;};window.addEventListener('keydown',e=>{if(selected&&!['SELECT','BUTTON'].includes(e.target.tagName))selected.game.keyDown(e);});window.addEventListener('keyup',e=>selected?.game.keyUp(e));function frame(t){const dt=last?Math.min(.04,(t-last)/1000):0;last=t;for(const v of views){const r=v.canvas.getBoundingClientRect();if(r.bottom<0||r.top>innerHeight)continue;if(running)v.game.update(dt);else if(v.turnPreview>0){const step=Math.min(dt,v.turnPreview);v.game.time+=step;v.boss.abyssClock+=step;v.turnPreview-=step;}draw(v);}requestAnimationFrame(frame);}requestAnimationFrame(frame);
})();</script></html>
